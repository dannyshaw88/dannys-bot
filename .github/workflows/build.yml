name: Build & Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build lib/db
        run: pnpm --filter @workspace/db run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build React frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci

      - name: Archive build outputs
        run: tar -czf web-builds.tar.gz artifacts/api-server/dist artifacts/dannys-bot/dist

      - name: Upload web builds
        uses: actions/upload-artifact@v4
        with:
          name: web-builds
          path: web-builds.tar.gz
          if-no-files-found: error

  package-windows:
    name: Package Windows Installer
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: artifacts/electron/node_modules
          key: ${{ runner.os }}-electron-npm-${{ hashFiles('artifacts/electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-npm-

      - name: Download web builds
        uses: actions/download-artifact@v4
        with:
          name: web-builds

      - name: Extract build outputs
        run: tar -xzf web-builds.tar.gz

      - name: Install Electron dependencies
        working-directory: artifacts/electron
        run: npm install

      - name: Bundle Electron main process
        working-directory: artifacts/electron
        run: node build.mjs
        env:
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

      - name: Package Windows installer
        working-directory: artifacts/electron
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}

      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equinox-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error
