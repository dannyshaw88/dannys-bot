name: Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build web bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci
      - name: Upload API bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist
          if-no-files-found: error
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist/public
          if-no-files-found: error

  package-windows:
    name: Build Windows Installer
    # Pin the runner: windows-latest has moved to Visual Studio 18, which
    # this Electron 33/@electron-rebuild native-module stack cannot discover.
    # The better-sqlite3 rebuild requires the VS 2022 toolchain.
    runs-on: windows-2022
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust for the Windows relay
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the patched Windows reverse-tether relay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --manifest-path artifacts/electron/third_party/gnirehtet-relay-rust/Cargo.toml
          $target = "artifacts/electron/resources/bin/win32/gnirehtet"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "artifacts/electron/third_party/gnirehtet-relay-rust/target/release/gnirehtet.exe" "$target/gnirehtet.exe"

          $archive = Join-Path $env:RUNNER_TEMP "gnirehtet-rust-win64-v2.5.1.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "gnirehtet-rust"
          Invoke-WebRequest `
            -Uri "https://github.com/Genymobile/gnirehtet/releases/download/v2.5.1/gnirehtet-rust-win64-v2.5.1.zip" `
            -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "7f5b1063e7895182aa60def1437e50363c3758144088dcd079037bb7c3c46a1c") {
            throw "Gnirehtet release archive SHA-256 did not match the published checksum."
          }
          Expand-Archive -Force -Path $archive -DestinationPath $unpack
          $apks = @(Get-ChildItem -Path $unpack -Filter "gnirehtet.apk" -File -Recurse)
          if ($apks.Count -ne 1) {
            throw "Expected exactly one gnirehtet.apk in the verified archive; found $($apks.Count)."
          }
          Copy-Item $apks[0].FullName "$target/gnirehtet.apk"
      - name: Download API bundle
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist/public
      - name: Install Electron dependencies
        working-directory: artifacts/electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installing Electron dependencies (attempt $attempt/$maxAttempts)"
            npm install --ignore-scripts `
              --fetch-retries=5 `
              --fetch-retry-factor=2 `
              --fetch-retry-mintimeout=2000 `
              --fetch-retry-maxtimeout=60000
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "npm install failed after $maxAttempts attempts"
            }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs
      - name: Verify Windows packaging inputs
        working-directory: artifacts/electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "dist/main.js",
            "dist/server/start.mjs",
            "dist/frontend/public/index.html",
            "resources/bin/win32/idevice_id.exe",
            "resources/bin/win32/gnirehtet/gnirehtet.exe",
            "resources/bin/win32/gnirehtet/gnirehtet.apk",
            "assets/icon.ico"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required Windows packaging input is missing: $path"
            }
            Write-Host "Verified: $path"
          }
      - name: Select Visual Studio toolchain for native Electron modules
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure node-gyp for Visual Studio 2022
        shell: pwsh
        run: |
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
      - name: Rebuild Sharp for Electron 33
        working-directory: artifacts/electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The API child runs under Electron's Node ABI
          # (ELECTRON_RUN_AS_NODE=1), not the system Node ABI. Rebuild Sharp
          # explicitly so its native module cannot load the wrong ABI and
          # terminate the API with STATUS_ACCESS_VIOLATION (0xC0000005).
          npx --yes @electron/rebuild@3.6.1 -f -w sharp
      - name: Build Windows installer
        working-directory: artifacts/electron
        run: npx electron-builder --win --publish never --debug
        env:
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error
      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/electron/release/*.exe