<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function() {
        var c = localStorage.getItem("equinox-theme-color") || "blue";
        var m = localStorage.getItem("equinox-theme-mode") || "dark";
        var h = document.documentElement;
        if (m === "dark") h.classList.add("dark");
        if (c !== "blue") h.classList.add("theme-" + c);
      })();
    </script>
    <title>Aura Farming</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="Aura Farming" />
    <meta name="apple-mobile-web-app-title" content="Aura Farming" />
    <!-- Fonts are bundled with the app — no external CDN required -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
