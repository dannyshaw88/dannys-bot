name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: "ci"
          BASE_PATH: "/"

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Electron main process
        run: pnpm --filter @workspace/electron run build

      - name: Inject bindings shim into better-sqlite3
        run: |
          node -e "
          const path = require('path');
          const fs = require('fs');

          const pnpmDir = path.join(process.cwd(), 'node_modules', '.pnpm');
          const bs3Entry = fs.readdirSync(pnpmDir).find(e => e.startsWith('better-sqlite3@'));
          if (!bs3Entry) throw new Error('better-sqlite3 not found in pnpm store');
          const bs3Dir = path.join(pnpmDir, bs3Entry, 'node_modules', 'better-sqlite3');
          console.log('better-sqlite3 dir:', bs3Dir);

          const shimDir = path.join(bs3Dir, 'node_modules', 'bindings');
          fs.mkdirSync(shimDir, { recursive: true });

          // Shim: load the .node file directly — no path-searching needed
          const shim = [
            \"'use strict';\",
            \"const path = require('path');\",
            \"module.exports = function(name) {\",
            \"  const f = path.join(__dirname, '..', '..', 'build', 'Release', name + '.node');\",
            \"  return require(f);\",
            \"};\"
          ].join('\n');

          fs.writeFileSync(path.join(shimDir, 'index.js'), shim);
          fs.writeFileSync(path.join(shimDir, 'package.json'), JSON.stringify({ name: 'bindings', version: '1.5.0', main: 'index.js' }));
          console.log('Bindings shim written to', shimDir);
          "

      - name: Package Windows installer
        run: pnpm --filter @workspace/electron run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-windows-installer
          path: artifacts/electron/release/*.exe
          retention-days: 30
