name: Build Windows Installer

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.0.600)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Build API server bundle
        working-directory: artifacts/api-server
        run: node ./build.mjs
        env:
          NODE_ENV: production

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=0.0.0-dev.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Install electron-builder
        run: pnpm add -g electron-builder

      - name: Build Windows installer
        working-directory: artifacts/api-server
        run: |
          electron-builder --win --x64 --config.appId=com.equinox.dannysbot \
            --config.productName="Equinox" \
            --config.win.target=nsis \
            --config.nsis.oneClick=false \
            --config.nsis.allowToChangeInstallationDirectory=true \
            --config.files="dist/**/*,node_modules/**/*,package.json" \
            --config.extraResources="../../database.db" \
            --config.directories.output=installer-output \
            --config.directories.buildResources=build-resources \
            --config.win.icon=build-resources/icon.ico \
            --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build Windows installer (fallback — pkg)
        if: failure()
        working-directory: artifacts/api-server
        shell: bash
        run: |
          pnpm add -g @vercel/pkg
          pkg dist/index.mjs \
            --target node24-win-x64 \
            --output installer-output/equinox-win-x64.exe \
            --compress GZip
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: List output
        working-directory: artifacts/api-server
        shell: bash
        run: ls -lh installer-output/ 2>/dev/null || echo "No output directory found"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: equinox-windows-installer-${{ steps.version.outputs.VERSION }}
          path: |
            artifacts/api-server/installer-output/*.exe
            artifacts/api-server/installer-output/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/api-server/installer-output/*.exe
            artifacts/api-server/installer-output/*.msi
          name: Equinox v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
