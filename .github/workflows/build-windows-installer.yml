name: Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build web bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci
      - name: Upload API bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist
          if-no-files-found: error
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist/public
          if-no-files-found: error

  package-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download API bundle
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist/public
      - name: Install Electron dependencies
        working-directory: artifacts/electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installing Electron dependencies (attempt $attempt/$maxAttempts)"
            npm install --ignore-scripts `
              --fetch-retries=5 `
              --fetch-retry-factor=2 `
              --fetch-retry-mintimeout=2000 `
              --fetch-retry-maxtimeout=60000
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "npm install failed after $maxAttempts attempts"
            }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs
      - name: Build Windows installer
        working-directory: artifacts/electron
        run: npx electron-builder --win --publish never
        env:
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error
      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/electron/release/*.exe