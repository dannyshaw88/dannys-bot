name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Step 1: Build the web bundle on Linux (fast, free) ────────────────────
  build-web:
    name: Build Web (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build lib/db
        run: pnpm --filter @workspace/db run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build React frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci

      - name: Archive build outputs
        run: tar -czf web-builds.tar.gz artifacts/api-server/dist artifacts/dannys-bot/dist

      - name: Upload web builds
        uses: actions/upload-artifact@v4
        with:
          name: web-builds
          path: web-builds.tar.gz
          if-no-files-found: error

  # ── Step 2: Package the Electron installer on Windows ─────────────────────
  package-windows:
    name: Package Windows Installer
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Electron npm dependencies
        uses: actions/cache@v4
        with:
          path: artifacts/electron/node_modules
          key: ${{ runner.os }}-electron-npm-${{ hashFiles('artifacts/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-npm-

      - name: Download web builds
        uses: actions/download-artifact@v4
        with:
          name: web-builds

      - name: Extract build outputs
        run: tar -xzf web-builds.tar.gz

      - name: Install Electron dependencies
        working-directory: artifacts/electron
        run: npm install

      - name: Bundle Electron main process
        working-directory: artifacts/electron
        run: node build.mjs
        env:
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

      - name: Package Windows installer (.exe)
        working-directory: artifacts/electron
        env:
          GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}
        run: ./node_modules/.bin/electron-builder --win --publish always

      # Always upload the .exe as an Actions artifact so you can download it
      # from the Actions run page regardless of whether a tag release exists.
      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equinox-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error

      # When the workflow is triggered by a version tag (e.g. v1.1.464),
      # also attach the .exe to a GitHub Release so users can download it
      # from the Releases page and the auto-updater can find it.
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/electron/release/*.exe
          generate_release_notes: false
          body: |
            ## Equinox ${{ github.ref_name }}

            ### How to install
            1. Download **equinox-setup-*.exe** below.
            2. Run it — if Windows SmartScreen appears, click **More info → Run anyway**.
            3. Launch **Equinox** from your desktop or Start menu.

            See [CHANGELOG.md](https://github.com/dannyshaw88/dannys-bot/blob/main/CHANGELOG.md) for what changed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
