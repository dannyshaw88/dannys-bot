name: Build and Package

  "on":
    push:
      branches: [main]

  jobs:
    build-web:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: pnpm/action-setup@v4
          with:
            version: 10

        - name: Install workspace deps
          run: pnpm install --no-frozen-lockfile --ignore-scripts

        - name: Build API server
          run: pnpm --filter @workspace/api-server run build

        - name: Build frontend
          env:
            REPL_ID: ci
          run: pnpm --filter @workspace/dannys-bot run build

        - name: Upload web builds
          uses: actions/upload-artifact@v4
          with:
            name: web-builds
            path: |
              artifacts/api-server/dist/
              artifacts/dannys-bot/dist/public/
            if-no-files-found: error

    package-windows:
      runs-on: windows-latest
      needs: build-web
      steps:
        - uses: actions/checkout@v4

        - name: Download web builds
          uses: actions/download-artifact@v4
          with:
            name: web-builds
            path: artifacts

        - name: Install Electron deps
          working-directory: artifacts/electron
          run: npm install

        - name: Build Electron app
          working-directory: artifacts/electron
          env:
            DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          run: node build.mjs

        - name: Package Windows installer
          working-directory: artifacts/electron
          env:
            GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          run: npx electron-builder --win --publish always

        - name: Upload installer to Actions artifacts
          uses: actions/upload-artifact@v4
          with:
            name: Equinox-Windows-Installer
            path: artifacts/electron/release/*.exe
            if-no-files-found: error
  