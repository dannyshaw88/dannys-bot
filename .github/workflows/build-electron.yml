name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Set version from run number
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('artifacts/electron/package.json','utf8'));p.version='1.0.'+process.env.RUN_NUMBER;fs.writeFileSync('artifacts/electron/package.json',JSON.stringify(p,null,2));console.log('Version:',p.version);"
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Generate icon from SVG
        run: |
          magick artifacts/electron/assets/icon.svg -resize 256x256 artifacts/electron/assets/icon.png
          magick artifacts/electron/assets/icon.png -define icon:auto-resize="256,128,64,48,32,16" artifacts/electron/assets/icon.ico
          echo "Icon generated"

      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: "ci"
          BASE_PATH: "/"

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Electron main process
        run: pnpm --filter @workspace/electron run build

      - name: Patch better-sqlite3 to load native binary directly
        run: node scripts/inject-bindings-shim.cjs

      - name: Package and publish Windows installer
        run: pnpm --filter @workspace/electron run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-windows-installer
          path: artifacts/electron/release/*.exe
          retention-days: 30
