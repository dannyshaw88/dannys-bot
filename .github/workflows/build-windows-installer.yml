name: Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci
      - name: Install Electron dependencies
        working-directory: artifacts/electron
        run: npm install --ignore-scripts
      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs
      - name: Build Windows installer
        working-directory: artifacts/electron
        run: npx electron-builder --win --publish never
      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error