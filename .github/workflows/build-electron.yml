name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: "ci"
          BASE_PATH: "/"

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Electron main process
        run: pnpm --filter @workspace/electron run build

      - name: Vendor bindings into better-sqlite3 (fixes asar module resolution)
        run: |
          node -e "
          const path = require('path');
          const fs = require('fs');

          function findInPnpm(pkgName) {
            const pnpmDir = path.join(process.cwd(), 'node_modules', '.pnpm');
            const entries = fs.readdirSync(pnpmDir);
            const match = entries.find(e => e.startsWith(pkgName + '@'));
            if (match) return path.join(pnpmDir, match, 'node_modules', pkgName);
            throw new Error('Not found in pnpm store: ' + pkgName);
          }

          const bs3Dir = findInPnpm('better-sqlite3');
          console.log('better-sqlite3:', bs3Dir);

          const destBase = path.join(bs3Dir, 'node_modules');
          fs.mkdirSync(destBase, { recursive: true });

          for (const pkg of ['bindings', 'file-uri-to-path', 'node-gyp-build']) {
            try {
              const src = findInPnpm(pkg);
              const dest = path.join(destBase, pkg);
              fs.cpSync(src, dest, { recursive: true, force: true });
              console.log('Vendored', pkg, '->', dest);
            } catch(e) {
              console.log('Skip', pkg, ':', e.message);
            }
          }
          "

      - name: Package Windows installer
        run: pnpm --filter @workspace/electron run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-windows-installer
          path: artifacts/electron/release/*.exe
          retention-days: 30
