name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Electron main process
        run: pnpm --filter @workspace/electron run build

      - name: Package Windows installer
        run: pnpm --filter @workspace/electron run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-windows-installer
          path: artifacts/electron/release/*.exe
          retention-days: 30
