name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci
      # Upload each dist directory as its own artifact so download-artifact
      # can place files at the exact target path without any copy/rename step.
      - name: Upload API server dist
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist/
          if-no-files-found: error
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist/
          if-no-files-found: error

  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-web
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Download directly into the paths the Electron builder expects.
      # No copy step needed — download-artifact places files at the given path.
      - name: Download API server dist
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist

      - name: Verify dist files
        run: |
          echo "=== api-server/dist ==="
          ls artifacts/api-server/dist/
          echo "=== dannys-bot/dist ==="
          ls artifacts/dannys-bot/dist/

      - name: Install Electron deps
        working-directory: artifacts/electron
        run: npm install --ignore-scripts

      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs

      - name: Build installer
        working-directory: artifacts/electron
        run: npx electron-builder --win --publish never
        env:
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/electron/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATER_TOKEN }}
