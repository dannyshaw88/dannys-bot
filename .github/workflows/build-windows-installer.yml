name: Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build web bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci
      - name: Upload web bundles
        uses: actions/upload-artifact@v4
        with:
          name: web-builds
          path: |
            artifacts/api-server/dist
            artifacts/dannys-bot/dist/public
          if-no-files-found: error

  package-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-builds
          path: .
      - name: Install Electron dependencies
        working-directory: artifacts/electron
        run: npm install --ignore-scripts
      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs
      - name: Build Windows installer
        working-directory: artifacts/electron
        run: npx electron-builder --win --publish never
        env:
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error
      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/electron/release/*.exe