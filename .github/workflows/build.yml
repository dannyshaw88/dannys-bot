name: Build Windows Installer

  on:
    push:
      branches: [main]
    workflow_dispatch:

  jobs:
    build-web:
      name: Build Web Assets
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: pnpm/action-setup@v4
          with:
            version: 9

        - uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: 'pnpm'

        - name: Install dependencies
          run: pnpm install --no-frozen-lockfile --ignore-scripts

        - name: Build API server
          run: pnpm --filter @workspace/api-server run build

        - name: Build frontend
          env:
            REPL_ID: ci
          run: pnpm --filter @workspace/dannys-bot run build

        - name: Upload web builds
          uses: actions/upload-artifact@v4
          with:
            name: web-builds
            path: |
              artifacts/api-server/dist/
              artifacts/dannys-bot/dist/
            if-no-files-found: error
            retention-days: 1

    package-windows:
      name: Package Windows Installer
      runs-on: windows-latest
      needs: build-web
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: 24

        - name: Download web builds
          uses: actions/download-artifact@v4
          with:
            name: web-builds

        - name: Install Electron dependencies
          working-directory: artifacts/electron
          run: npm install

        - name: Build Electron bundle
          working-directory: artifacts/electron
          env:
            DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          run: node build.mjs

        - name: Package installer
          working-directory: artifacts/electron
          env:
            GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          run: npm run package

        - name: Upload installer to Actions artifacts
          uses: actions/upload-artifact@v4
          with:
            name: Equinox-Windows-Installer
            path: artifacts/electron/release/*.exe
            if-no-files-found: error
  