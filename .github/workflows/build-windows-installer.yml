name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci
      - name: Verify release version
        shell: bash
        run: |
          root_version="$(node -p "require('./package.json').version")"
          electron_version="$(node -p "require('./artifacts/electron/package.json').version")"
          test "$root_version" = "$electron_version"
          grep -F "## [$root_version]" CHANGELOG.md
          test -f artifacts/electron/build.mjs
          test -f artifacts/electron/electron-builder.json
          echo "Building Aura Farming version $root_version"
      - name: Verify TrustScore Human Session Tool split layout
        shell: bash
        run: |
          grep -F 'className="w-1/2 h-full min-h-0 flex items-center justify-center"' artifacts/dannys-bot/src/pages/TrustScoreDetailPage.tsx
          grep -F 'className="w-1/2 h-full min-h-0 border-l border-border"' artifacts/dannys-bot/src/pages/TrustScoreDetailPage.tsx
          grep -F '<FakeTrustScoreMirror trustScoreLabel={level.label} />' artifacts/dannys-bot/src/pages/TrustScoreDetailPage.tsx
          grep -F 'ref={paneRef} className="h-full w-full min-h-0 flex items-center justify-center p-4"' artifacts/dannys-bot/src/components/FakeTrustScoreMirror.tsx
          grep -F 'const availableScreenH = Math.max(0, paneRect.height - chromeH)' artifacts/dannys-bot/src/components/FakeTrustScoreMirror.tsx
          grep -F 'const phoneRatio = 9 / 16' artifacts/dannys-bot/src/components/FakeTrustScoreMirror.tsx
          echo "TrustScore Human Session Tool split layout verified"
      - name: Verify Browser persistence and removed AI Images sources
        shell: bash
        run: |
          grep -F "synthetic browser stream detached — keeping Chrome and active page alive" artifacts/api-server/src/instagram/browserSession.ts
          grep -F "synthetic browser is at" artifacts/api-server/src/instagram/browserSession.ts
          grep -F "preserving current page" artifacts/api-server/src/instagram/browserSession.ts
          grep -F 'className={activeTab === "browser"' artifacts/dannys-bot/src/pages/MobilePage.tsx
          test ! -e artifacts/dannys-bot/src/pages/ImageGenPage.tsx
          test ! -e artifacts/api-server/src/routes/imageGen.ts
          test ! -e artifacts/electron/sidecar/server.py
          if grep -R -n -E "ImageGenPage|registerImageGenRoutes|image-generation|sd15-config" \
            artifacts/dannys-bot/src artifacts/api-server/src artifacts/electron/src artifacts/electron/electron-builder.json; then
            echo "Obsolete AI Images runtime or packaging wiring is still present"
            exit 1
          fi
          echo "Browser persistence and AI Images removal verified"
      - name: Verify shared image-processing filter behavior
        shell: bash
        run: |
          grep -F ': { min: 0, max: 0 },' artifacts/api-server/src/src/instagram/imageAlteration.ts
          grep -F 'if (blurSigma > 0)' artifacts/api-server/src/src/instagram/imageAlteration.ts
          grep -F 'fetch("/api/images/process"' artifacts/dannys-bot/src/pages/ImagesPage.tsx
          grep -F 'alterationLevel={settings.makePostAlterationLevel}' artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F 'settings={settings.makePostImageSettings}' artifacts/dannys-bot/src/pages/MobilePage.tsx
          echo "Shared Fix Images and Make a Post image processing verified"
      - name: Verify standalone Post a Story tool
        shell: bash
        run: |
          grep -F "postStoryEnabled: z.boolean().default(false)" artifacts/api-server/src/routes/mobile.ts
          grep -F 'post-story-folder-path' artifacts/api-server/src/routes/mobile.ts
          grep -F "postStory: postStoryEnabled && rollActivate" artifacts/api-server/src/routes/mobile.ts
          grep -F "'postStory'" artifacts/api-server/src/routes/mobile.ts
          grep -F "runMakePostStoryStep" artifacts/api-server/src/routes/mobile.ts
          grep -F "makeUnique: postStoryMakeUnique" artifacts/api-server/src/routes/mobile.ts
          grep -F 'label htmlFor={`post-a-story-enabled-' artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F "postStoryImageSettingsOpen" artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F "Post a Story" artifacts/dannys-bot/src/pages/mobileShared.ts
          grep -F "postStoryLocalFolderPath" artifacts/dannys-bot/src/pages/mobileShared.ts
          echo "Standalone Post a Story configuration verified"
      - name: Verify TrustScore layout and countdown timing
        shell: bash
        run: |
          grep -F 'className="w-[185px] text-center"' artifacts/dannys-bot/src/pages/ToolsPage.tsx
          grep -F 'w-[50ch] justify-start shrink-0' artifacts/dannys-bot/src/pages/ToolsPage.tsx
          grep -F 'className="flex items-center gap-2 self-center"' artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F 'gap: "8px"' artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F "expiresAt?: number | null" artifacts/dannys-bot/src/components/TrustScoreCountdown.tsx
          grep -F "expiresAt - Date.now()" artifacts/dannys-bot/src/components/TrustScoreCountdown.tsx
          grep -F "relative top-0.5" artifacts/dannys-bot/src/components/TrustScoreCountdown.tsx
          echo "TrustScore layout and countdown timing verified"
      - name: Verify account-specific Posted Media and Posts statistics
        shell: bash
        run: |
          grep -F 'app.get("/api/mobile/devices/:serial/posted-profile-media"' artifacts/api-server/src/routes/mobile.ts
          grep -F "recordPostedProfileMedia(serial, opts.slotIdx" artifacts/api-server/src/routes/mobile.ts
          grep -F "accountUsername: slotUsername" artifacts/api-server/src/routes/mobile.ts
          grep -F "posted-profile-media" artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F "entry.filename" artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F "entry.postedAt" artifacts/dannys-bot/src/pages/MobilePage.tsx
          grep -F 'key: "posts"' artifacts/dannys-bot/src/pages/StatsPage.tsx
          grep -F 'label: "Posts"' artifacts/dannys-bot/src/pages/StatsPage.tsx
          grep -F "postsDaily" artifacts/dannys-bot/src/pages/StatsPage.tsx
          echo "Account-specific Posted Media and Posts statistics verified"
      # Upload each dist directory as its own artifact so download-artifact
      # can place files at the exact target path without any copy/rename step.
      - name: Upload API server dist
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist/
          if-no-files-found: error
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist/
          if-no-files-found: error

  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-web
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Download directly into the paths the Electron builder expects.
      # No copy step needed — download-artifact places files at the given path.
      - name: Download API server dist
        uses: actions/download-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: dannys-bot-dist
          path: artifacts/dannys-bot/dist

      - name: Verify dist files
        run: |
          echo "=== api-server/dist ==="
          ls artifacts/api-server/dist/
          echo "=== dannys-bot/dist ==="
          ls artifacts/dannys-bot/dist/

      - name: Verify Reel DM recipient safety sources
        shell: bash
        run: |
          grep -F "strictContactParents: true" artifacts/api-server/src/routes/mobile.ts
          grep -F "no validated Chat avatar nodes" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "recipient selection was not positively confirmed" artifacts/api-server/src/routes/mobile.ts
          grep -F "shared post via DM — Send tapped" artifacts/api-server/src/routes/mobile.ts
          if sed -n '5190,5320p' artifacts/api-server/src/routes/mobile.ts | grep -F "DM likely sent by recipient tap"; then
            echo "Unsafe Reel dismissed-sheet success fallback is still present"
            exit 1
          fi
          echo "Reel DM recipient safety configuration verified"

      - name: Verify mobile automation and account display fixes
        shell: bash
        run: |
          grep -F 'reels: "VIEW REELS"' artifacts/api-server/src/routes/mobile.ts
          grep -F 'feed: "VIEW FEED"' artifacts/api-server/src/routes/mobile.ts
          grep -F 'explore: "VIEW EXPLORE"' artifacts/api-server/src/routes/mobile.ts
          grep -F "allowBack=*/i > 0" artifacts/api-server/src/routes/mobile.ts
          grep -F "scanViewFeedA11y" artifacts/api-server/src/routes/mobile.ts
          grep -F "remove from saved" artifacts/api-server/src/routes/mobile.ts
          grep -F 'title={`Open Human Session Tool for ${slot.username}`}' artifacts/dannys-bot/src/pages/StatsPage.tsx
          if grep -F "@{slot.username}" artifacts/dannys-bot/src/pages/StatsPage.tsx; then
            echo "Statistics Device / Account column still has an @ prefix"
            exit 1
          fi
          grep -F "item.targetUsername ? item.targetUsername : label" artifacts/dannys-bot/src/pages/Dashboard.tsx
          if grep -F '`@${item.targetUsername}`' artifacts/dannys-bot/src/pages/Dashboard.tsx; then
            echo "Dashboard Account column still formats phone accounts with @"
            exit 1
          fi
          echo "Mobile automation and account display fixes verified"

      - name: Verify Mobile Phone Apps manual-search UI
        shell: bash
        run: |
          grep -F "Internal Links Clicked" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Manual Searches Activation" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "manualSearchPctMin" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "manualSearchPctMax" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Searches Per Run" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Search Result Scrolls" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Search Result Link" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Result Dwell Seconds" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "manualSearchCountMin" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "manualSearchScrollMin" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "manualSearchLinkPctMin" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "manualSearchDwellMin" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Tap Trending Storys" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F 'value={settings.chrome.internalLinkPctMax' artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F 'value={settings.chrome.manualSearchPctMax' artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F 'value={settings.chrome.manualSearchLinkPctMax' artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          if grep -F "Internal Links Clicked %" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx; then
            echo "Percentage symbols must not appear in field titles"
            exit 1
          fi
          if grep -F "Manual Searches Activation %" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx; then
            echo "Percentage symbols must not appear in field titles"
            exit 1
          fi
          if grep -F "Search Result Link %" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx; then
            echo "Percentage symbols must not appear in field titles"
            exit 1
          fi
          if grep -F "Checkbox" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx; then
            echo "Manual Searches UI must not reintroduce a checkbox"
            exit 1
          fi
          echo "Mobile Phone Apps manual-search UI configuration verified"

      - name: Verify Mobile Phone Apps search variety and logging
        shell: bash
        run: |
          grep -F "naturalSentenceQueries" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "CHROME_SEARCH_QUERIES_BY_WORD_COUNT" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "CHROME_SEARCH_WORD_COUNTS" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "2 + Math.floor(Math.random() * 4)" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "chooseChromeManualSearchQuery" artifacts/api-server/src/mobile/androidManager.ts
          grep -F 'selected ${selected.wordCount}-word query' artifacts/api-server/src/mobile/androidManager.ts
          grep -F "exactly 2–5 words" artifacts/api-server/src/mobile/androidManager.ts
          if grep -F "CHROME_ONE_WORD_SEARCH_QUERIES" artifacts/api-server/src/mobile/androidManager.ts; then
            echo "One-word manual search pool must not be present"
            exit 1
          fi
          grep -F "Starting Phone Apps cycle" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Cycle complete — Phone Apps" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Cycle failed — Phone Apps" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          grep -F "Cycle aborted — Phone Apps" artifacts/dannys-bot/src/pages/MobilePhoneApps.tsx
          echo "Mobile Phone Apps search variety and debugging-log configuration verified"
      - name: Verify Chrome search input and Trending WebView safeguards
        shell: bash
        run: |
          grep -F 'runInputShell(serial, ["text", escapeForAdbInput(text)], "text")' artifacts/api-server/src/mobile/androidManager.ts
          grep -F "findGoogleTrendingSearchRows" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "no screenshot-confirmed row" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "readChromeUrl" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "row tap" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "await runTrendingGoogleStories();" artifacts/api-server/src/mobile/androidManager.ts
          echo "Chrome search input and Trending WebView safeguards verified"
      - name: Verify story Emoji uses verified keyboard fallbacks
        shell: bash
        run: |
          grep -F "findStoryReplyComposerViaA11y" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "[story-composer] no candidate" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "lowerNodes=" artifacts/api-server/src/mobile/androidManager.ts
          grep -F 'screen=${w}x${h}' artifacts/api-server/src/mobile/androidManager.ts
          grep -F "reply composer not found" artifacts/api-server/src/routes/mobile.ts
          grep -F "tapKeyboardEmojiNode" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "dumpUiWithIme(serial)" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "live-node, calibrated-tap, or visual fallback" artifacts/api-server/src/routes/mobile.ts
          grep -F "calibrated physical tap" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "findKeyboardEmojiButton(serial)" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "isKeyboardEmojiPickerOpen" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "live Emoji picker node not found" artifacts/api-server/src/mobile/androidManager.ts
          if grep -F "without coordinate/pixel fallback" artifacts/api-server/src/routes/mobile.ts; then
            echo "Obsolete Story Emoji no-fallback diagnostic is still present"
            exit 1
          fi
          if grep -F 'inputText(serial, _chosenEmoji)' artifacts/api-server/src/routes/mobile.ts; then
            echo "Story Emoji flow must not inject Unicode directly"
            exit 1
          fi
          if grep -F "message_composer_container" artifacts/api-server/src/routes/mobile.ts | grep -F "_composerPresent"; then
            echo "Story Emoji flow must not require the obsolete ID-only composer gate"
            exit 1
          fi
          echo "Story Emoji live-node execution verified"
      - name: Verify per-device keyboard bind execution
        shell: bash
        run: |
          grep -F "tapCalibratedKeyboardKey" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "const aliases = normalized === \"emoji\"" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "live IME node" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "android.tapCalibratedKeyboardKey" artifacts/api-server/src/routes/mobile.ts
          grep -F "tapKeyboardEmojiNode" artifacts/api-server/src/routes/mobile.ts
          echo "Per-device named keyboard bind and live-node execution verified"
      - name: Verify normal X typing cannot silently skip
        shell: bash
        run: |
          grep -F "const requestedLetterMissing" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "const visibleLetterKeys" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "checked ASCII input fallback" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "using normal character typing path" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "runInputShell(" artifacts/api-server/src/mobile/androidManager.ts
          grep -F "tap failed for" artifacts/api-server/src/mobile/androidManager.ts
          echo "Normal character keyboard safeguards verified"

      - name: Install Electron deps
        working-directory: artifacts/electron
        run: npm install --ignore-scripts

      - name: Restore electron-builder download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('artifacts/electron/package.json', 'artifacts/electron/electron-builder.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs

      - name: Build installer
        working-directory: artifacts/electron
        run: |
          for attempt in 1 2 3; do
            echo "Building Windows installer (attempt $attempt of 3)"
            if npx electron-builder --win --publish never; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "electron-builder failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "electron-builder failed after 3 attempts"
          exit 1
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          DANNY_BOT_UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

      - name: Verify Windows installer
        working-directory: artifacts/electron
        shell: bash
        run: |
          installer_count="$(find release -maxdepth 1 -type f -iname '*.exe' | wc -l)"
          test "$installer_count" -gt 0
          installer_bytes="$(find release -maxdepth 1 -type f -iname '*.exe' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          test "$installer_bytes" -gt 1000000
          echo "Windows installer artifacts:"
          find release -maxdepth 1 -type f -iname '*.exe' -print

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/electron/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATER_TOKEN }}
