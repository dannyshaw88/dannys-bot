name: Windows Installer Download

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-installer:
    name: Build and upload Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/dannys-bot run build
        env:
          REPL_ID: ci

      - name: Install Electron dependencies
        working-directory: artifacts/electron
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron bundle
        working-directory: artifacts/electron
        run: node build.mjs

      - name: Build Windows installer
        working-directory: artifacts/electron
        run: pnpm exec electron-builder --win --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache

      - name: Verify installer exists
        shell: bash
        run: |
          test -n "$(find artifacts/electron/release -maxdepth 1 -type f -iname '*.exe' -print -quit)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Farming-Windows-Installer
          path: artifacts/electron/release/*.exe
          if-no-files-found: error